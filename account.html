<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reader Account | Rahul Kumar Das</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="cloud-cms.js"></script></head>
<body><main class="inner-page"><div class="container" style="max-width:620px"><a class="text-link" href="index.html">← Home</a><h1 class="page-title">Your Reader Account</h1><p style="color:#68635c">Create a free account to receive notifications about new books, articles, academic resources, research updates and announcements.</p>
<div class="admin-panel" style="margin-top:25px"><div id="message" style="padding:12px;margin-bottom:18px;border-radius:6px;display:none"></div>
<div id="signupBox"><h2>Create Account</h2><form id="signupForm"><label>Name<input id="name" type="text" autocomplete="name" required style="width:100%;padding:12px;margin:6px 0 15px"></label><label>Email<input id="email" type="email" autocomplete="email" required style="width:100%;padding:12px;margin:6px 0 15px"></label><label>Password<input id="password" type="password" autocomplete="new-password" minlength="6" required style="width:100%;padding:12px;margin:6px 0 18px"></label><button class="btn dark" type="submit">Create Free Account</button></form></div>
<div id="loginBox" style="margin-top:35px;padding-top:25px;border-top:1px solid #ddd"><h2 id="login">Already have an account?</h2><form id="loginForm"><label>Email<input id="loginEmail" type="email" autocomplete="email" required style="width:100%;padding:12px;margin:6px 0 15px"></label><label>Password<input id="loginPassword" type="password" autocomplete="current-password" required style="width:100%;padding:12px;margin:6px 0 18px"></label><button class="btn light" type="submit">Log In</button></form></div>
<div id="accountBox" style="display:none"><h2>Notification Preferences</h2><p id="signedInAs" style="color:#68635c"></p><label style="display:block;margin:15px 0"><input id="newBooks" type="checkbox" checked> New books and ebook releases</label><label style="display:block;margin:15px 0"><input id="announcements" type="checkbox" checked> Articles, research updates and announcements</label><button id="savePrefs" class="btn dark" type="button">Save Preferences</button> <button id="logout" class="btn light" type="button">Log Out</button></div>
</div></div></main>
<script>
const msg=document.getElementById("message");
function show(t,ok=true){msg.textContent=t;msg.style.display="block";msg.style.background=ok?"#eaf7ee":"#fff0f0";msg.style.color=ok?"#176b2c":"#9b1c1c"}
async function saveSubscriber(user,name){const {error}=await rkdSupabase.from("subscribers").upsert({id:user.id,email:user.email,full_name:name||user.user_metadata?.full_name||"",new_books:document.getElementById("newBooks").checked,announcements:document.getElementById("announcements").checked},{onConflict:"id"});if(error)throw error}
async function loadAccount(){const {data:{user}}=await rkdSupabase.auth.getUser();if(!user)return;document.getElementById("signupBox").style.display="none";document.getElementById("loginBox").style.display="none";document.getElementById("accountBox").style.display="block";document.getElementById("signedInAs").textContent="Signed in as "+user.email;const {data}=await rkdSupabase.from("subscribers").select("*").eq("id",user.id).maybeSingle();if(data){document.getElementById("newBooks").checked=data.new_books;document.getElementById("announcements").checked=data.announcements}}
document.getElementById("signupForm").addEventListener("submit",async e=>{e.preventDefault();try{const name=document.getElementById("name").value.trim(),email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;const redirect=location.origin+location.pathname;const {data,error}=await rkdSupabase.auth.signUp({email,password,options:{data:{full_name:name},emailRedirectTo:redirect}});if(error)throw error;if(data.session){await saveSubscriber(data.user,name);show("Account created. Your notification preferences are saved.");loadAccount()}else show("Account created. Please confirm your email from the message sent to you, then return here and log in.");}catch(e){show(e.message||"Could not create account.",false)}});
document.getElementById("loginForm").addEventListener("submit",async e=>{e.preventDefault();try{const email=document.getElementById("loginEmail").value.trim(),password=document.getElementById("loginPassword").value;const {data,error}=await rkdSupabase.auth.signInWithPassword({email,password});if(error)throw error;await saveSubscriber(data.user,data.user.user_metadata?.full_name||"");show("Welcome back. Your notification preferences are ready.");loadAccount()}catch(e){show(e.message||"Login failed.",false)}});
document.getElementById("savePrefs").addEventListener("click",async()=>{try{const {data:{user}}=await rkdSupabase.auth.getUser();if(!user)throw new Error("Please log in first.");await saveSubscriber(user,user.user_metadata?.full_name||"");show("Your notification preferences have been saved.")}catch(e){show(e.message||"Could not save preferences.",false)}});
document.getElementById("logout").addEventListener("click",async()=>{await rkdSupabase.auth.signOut();location.reload()});
loadAccount();
</script></body></html>
