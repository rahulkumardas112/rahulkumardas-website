<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Library | Rahul Kumar Das</title><link rel="stylesheet" href="styles.css"><style>
.reader-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-top:25px}.reader-card{border:1px solid #e1dbd1;background:#fff;padding:20px;border-radius:10px}.reader-cover{height:250px;background:#f1ede5;display:flex;align-items:center;justify-content:center;text-align:center;padding:15px;margin-bottom:15px;overflow:hidden}.reader-cover img{width:100%;height:100%;object-fit:cover}.reader-status{padding:14px;border-radius:8px;background:#f7f4ee;color:#625d56;margin:20px 0}.reader-wrap{margin-top:30px;padding:22px;border:1px solid #e1dbd1;background:#fff;border-radius:10px}.reader-toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:15px}.pdf-page{display:block;width:100%;max-width:900px;margin:0 auto 18px;background:#fff;box-shadow:0 3px 14px rgba(0,0,0,.12)}.security-note{font-size:13px;color:#777;margin-top:12px}.hidden{display:none}
</style></head><body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><span>Rahul Kumar Das</span><small>My Library</small></a><nav style="display:flex"><a href="index.html">Home</a><a href="books.html">Books</a><a href="account.html">Account</a></nav></div></header>
<main class="inner-page"><div class="container"><p class="eyebrow">YOUR READING SPACE</p><h1 class="page-title">My Library</h1><p id="intro">Your purchased ebooks are available here through a protected reader.</p><div id="loginNotice" class="reader-status hidden"></div><div id="libraryGrid" class="reader-grid"></div><div id="reader" class="reader-wrap hidden"><div class="reader-toolbar"><strong id="readerTitle"></strong><button class="btn light" id="closeReader" type="button">Back to Library</button></div><div id="readerStatus" class="reader-status">Loading secure reader…</div><div id="pages"></div><p class="security-note">This ebook is available only to the account used for the purchase. Download and print controls are intentionally not provided.</p></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script><script>
const SB_URL="https://ucehhsythixyvhrzwlth.supabase.co",SB_KEY="sb_publishable_bK03-qntjRlai8Q7yybHzw_JYn3FQrC",sb=window.supabase.createClient(SB_URL,SB_KEY),FN=SB_URL+"/functions/v1/secure-ebook";
let pdfjs=null;import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs").then(m=>{pdfjs=m;pdfjs.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs"}).catch(()=>{});
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
async function auth(){const {data:{user}}=await sb.auth.getUser();return user}
async function callFn(path){const {data:{session}}=await sb.auth.getSession();if(!session)throw new Error("Please log in first.");const r=await fetch(FN+path,{headers:{Authorization:"Bearer "+session.access_token,apikey:SB_KEY}});const type=r.headers.get("content-type")||"";if(!r.ok){let d={};try{d=await r.json()}catch{}throw new Error(d.error||"Could not access your library.")}return type.includes("application/json")?r.json():r.arrayBuffer()}
async function loadLibrary(){
 const user=await auth();const notice=document.getElementById("loginNotice");const grid=document.getElementById("libraryGrid");
 if(!user){notice.classList.remove("hidden");notice.textContent="Please log in with the same email address you used when purchasing an ebook.";return}
 try{const d=await callFn("");const books=d.books||[];if(!books.length){grid.innerHTML='<div class="reader-status">No paid ebooks are linked to this account yet. If you have already paid, make sure you are using the same email address entered at checkout.</div>';return}
 grid.innerHTML=books.map(b=>'<article class="reader-card"><div class="reader-cover">'+(b.cover_url?'<img src="'+esc(b.cover_url)+'" alt="'+esc(b.title)+'">':'<strong>'+esc(b.title)+'</strong>')+'</div><h3>'+esc(b.title)+'</h3><p>'+esc(b.author||"Rahul Kumar Das")+'</p><button class="btn dark read-btn" data-id="'+esc(b.id)+'">Read Securely</button></article>').join("");
 grid.querySelectorAll(".read-btn").forEach(btn=>btn.addEventListener("click",()=>openReader(btn.dataset.id,btn.closest(".reader-card").querySelector("h3").textContent)));
 }catch(e){grid.innerHTML='<div class="reader-status">'+esc(e.message)+'</div>'}
}
async function openReader(id,title){
 document.getElementById("libraryGrid").classList.add("hidden");document.getElementById("reader").classList.remove("hidden");document.getElementById("readerTitle").textContent=title;document.getElementById("readerStatus").textContent="Loading ebook…";document.getElementById("pages").innerHTML="";
 try{
   const buf=await callFn("?book_id="+encodeURIComponent(id));
   if(!pdfjs){document.getElementById("readerStatus").textContent="Reader is still loading. Please try again.";return}
   const pdf=await pdfjs.getDocument({data:new Uint8Array(buf)}).promise;document.getElementById("readerStatus").textContent=pdf.numPages+" pages";
   const pages=document.getElementById("pages");
   for(let n=1;n<=pdf.numPages;n++){const page=await pdf.getPage(n);const viewport=page.getViewport({scale:1.35});const canvas=document.createElement("canvas");canvas.className="pdf-page";canvas.width=viewport.width;canvas.height=viewport.height;pages.appendChild(canvas);await page.render({canvasContext:canvas.getContext("2d"),viewport}).promise}
 }catch(e){document.getElementById("readerStatus").textContent=e.message||"Could not open this ebook."}
}
document.getElementById("closeReader").onclick=()=>{document.getElementById("reader").classList.add("hidden");document.getElementById("libraryGrid").classList.remove("hidden");document.getElementById("pages").innerHTML=""};
loadLibrary();
</script></body></html>
