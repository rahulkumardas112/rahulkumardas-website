<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review Moderation | Rahul Kumar Das</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="styles.css?v=20261010"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="cloud-cms.js"></script>
<style>.moderation-item{background:#fff;border:1px solid #e3ddd3;border-radius:9px;padding:20px;margin:15px 0}.moderation-meta{color:#746f67;font-size:13px}.moderation-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.moderation-actions button{padding:10px 14px;border:0;border-radius:5px;cursor:pointer;font:inherit;font-weight:600}.approve{background:#e8f5e9;color:#216b37}.reject{background:#fff0ef;color:#9b3026}.moderation-status{padding:12px;background:#f7f4ee;border-radius:6px}</style></head>
<body><main class="inner-page"><div class="container" style="max-width:900px"><a href="admin.html" class="text-link">← Admin Dashboard</a><p class="eyebrow" style="margin-top:30px">SITE MANAGEMENT</p><h1 class="page-title">Reader review moderation</h1><p>Only approved reviews are visible on the public website. Sign in with an authorised administrator account to review submissions.</p><div id="moderationStatus" class="moderation-status" role="status">Checking administrator access…</div><div id="reviewQueue"></div></div></main>
<script>
const box=document.getElementById("moderationStatus"),queue=document.getElementById("reviewQueue");
function message(t){box.textContent=t}
function safeText(tag,txt){const e=document.createElement(tag);e.textContent=txt||"";return e}
async function init(){try{const {data:{user},error:authError}=await rkdSupabase.auth.getUser();if(authError)throw authError;if(!user){message("Please sign in through the admin dashboard, then open this page again.");return}const {data:admin,error:adminError}=await rkdSupabase.from("admin_users").select("id").eq("id",user.id).maybeSingle();if(adminError||!admin){message("Access denied. This account is not an authorised administrator.");return}await loadQueue()}catch(e){console.error(e);message("Could not verify administrator access. Please sign in again.")}}
async function loadQueue(){message("Loading pending reviews…");const {data,error}=await rkdSupabase.from("book_reviews").select("*").eq("status","pending").order("created_at",{ascending:true});if(error)throw error;queue.replaceChildren();if(!data.length){message("There are no pending reviews.");return}message(data.length+" review submission"+(data.length===1?"":"s")+" awaiting moderation.");for(const r of data){const card=document.createElement("article");card.className="moderation-item";card.append(safeText("h3",r.book_title),safeText("p",r.reviewer_name+" · "+r.rating+"/5 · "+new Date(r.created_at).toLocaleString()),safeText("p",r.review_text));const actions=document.createElement("div");actions.className="moderation-actions";for(const [label,value,cls] of [["Approve","approved","approve"],["Reject","rejected","reject"]]){const b=document.createElement("button");b.type="button";b.className=cls;b.textContent=label;b.onclick=()=>moderate(r.id,value,b);actions.append(b)}card.append(actions);queue.append(card)}}
async function moderate(id,status,button){button.disabled=true;try{const {error}=await rkdSupabase.from("book_reviews").update({status}).eq("id",id);if(error)throw error;await loadQueue()}catch(e){console.error(e);message("Could not update this review. Please try again.");button.disabled=false}}
init();
</script></body></html>
