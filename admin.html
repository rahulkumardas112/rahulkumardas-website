<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin | Rahul Kumar Das</title><link rel="stylesheet" href="styles.css">
<style>
.admin-wrap{max-width:1100px;margin:40px auto;padding:0 20px}.admin-card{background:#fff;border:1px solid #e5e0d8;border-radius:12px;padding:24px;margin:20px 0}.form{display:grid;grid-template-columns:1fr 1fr;gap:16px}.form label{font-weight:600}.form input,.form textarea,.form select{display:block;width:100%;box-sizing:border-box;margin-top:6px;padding:11px;border:1px solid #ccc;border-radius:7px;font:inherit}.full{grid-column:1/-1}.coverbox{border:1px dashed #bbb;padding:15px;text-align:center;border-radius:8px}.coverbox img{max-width:130px;max-height:180px;display:block;margin:10px auto}.books-list .row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid #eee}.thumb{width:55px;height:75px;object-fit:cover;background:#eee;border-radius:5px}.row .info{flex:1}.row button{margin-left:6px}.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}@media(max-width:700px){.form{grid-template-columns:1fr}.full{grid-column:auto}.row{flex-wrap:wrap}}
</style></head>
<body>
<header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><span>Rahul Kumar Das</span><small>Author · Academic · Educator · Researcher</small></a><nav><a href="index.html">Website</a><a href="books.html">Books</a></nav></div></header>
<main class="admin-wrap"><h1>Book Manager</h1><p>Add, edit or remove your books whenever you want.</p>
<section class="admin-card"><h2 id="heading">Add New Book</h2>
<form id="bookForm" class="form">
<label>Book Title<input id="title" required></label><label>Author<input id="author" value="Rahul Kumar Das"></label>
<label>Price (₹)<input id="price" type="number" min="0" required></label>
<label>Category<select id="category"><option>General / Other</option><option>Literary Fiction</option><option>Romance</option><option>Poetry</option><option>Self Help & Personal Development</option><option>Psychology</option><option>Philosophy</option><option>Human Behaviour</option><option>Relationships</option><option>Love, Loss & Heartbreak</option><option>Education</option><option>Academic Books</option><option>Accountancy</option><option>Accounting & Finance</option><option>Economics</option><option>Business & Management</option><option>Entrepreneurship & Startups</option><option>Commerce</option><option>Marketing</option><option>Banking & Financial Services</option><option>Stock Market & Investing</option><option>Taxation</option><option>Research Methodology</option><option>Competitive Exam Books</option><option>Question Banks</option><option>Notes & Study Materials</option><option>UGC NET / SET</option><option>Reference Books</option><option>Research Reports</option><option>Assam Studies</option><option>North East India</option><option>History</option><option>Language & Literature</option><option>Digital Guides & Workbooks</option></select></label>
<label class="full">Short Description<textarea id="desc" required></textarea></label>
<label class="full">Free Sample<textarea id="samplePages" placeholder="Optional"></textarea></label>
<label>Amazon Link<input id="amazon" type="url"></label><label>Buy Link<input id="buyLink" type="url" placeholder="Leave blank to use the website checkout"></label>
<label class="full">Book Cover<div class="coverbox"><input id="cover" type="file" accept="image/*"><img id="preview" style="display:none"><span id="coverText">Choose cover image</span></div></label>
<label class="full">Ebook PDF<div class="coverbox"><input id="pdf" type="file" accept="application/pdf"><span id="pdfText">Choose PDF file</span></div></label>
<div class="full btns"><button class="btn dark" type="submit" id="save">Add Book</button><button class="btn" type="button" id="cancel" style="display:none">Cancel Edit</button></div>
</form></section>
<section class="admin-card"><h2>Your Books <span id="count"></span></h2><div id="list" class="books-list"></div></section>
<section class="admin-card"><h2>Website Photos</h2><p>Upload photos that you want to display in your website gallery.</p>
<form id="photoForm" class="form">
<label>Photo Title<input id="photoTitle" placeholder="e.g. Book Launch"></label>
<label>Photo Category<select id="photoCategory"><option>Profile</option><option>Author & Writing</option><option>Academic & Research</option><option>Events & Felicitations</option><option>Books & Publications</option><option>Other</option></select></label>
<label class="full">Photo<input id="photoFile" type="file" accept="image/*" required></label>
<div class="full btns"><button class="btn dark" type="submit" id="photoSave">Upload Photo</button></div>
</form>
<div id="photoList" class="books-list"></div></section></main>
<script>
const DB="rkd_books_v2", STORE="books"; let editingId=null, coverFile=null, pdfFile=null;
const PHOTO_STORE="photos";
const $=id=>document.getElementById(id);
function db(){return new Promise((res,rej)=>{const q=indexedDB.open(DB,1);q.onupgradeneeded=()=>{const d=q.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:"id",autoIncrement:true});if(!d.objectStoreNames.contains(PHOTO_STORE))d.createObjectStore(PHOTO_STORE,{keyPath:"id",autoIncrement:true})};q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function all(){const d=await db();return new Promise((res,rej)=>{const q=d.transaction(STORE,"readonly").objectStore(STORE).getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function saveBook(b){const d=await db();return new Promise((res,rej)=>{const s=d.transaction(STORE,"readwrite").objectStore(STORE);const q=editingId?s.put({...b,id:editingId}):s.add(b);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function removeBook(id){const d=await db();return new Promise((res,rej)=>{const q=d.transaction(STORE,"readwrite").objectStore(STORE).delete(id);q.onsuccess=res;q.onerror=()=>rej(q.error)})}
function readFile(f){return new Promise((res,rej)=>{if(!f)return res(null);const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
cover.onchange=()=>{coverFile=cover.files[0]||null;if(coverFile)coverText.textContent=coverFile.name};
pdf.onchange=()=>{pdfFile=pdf.files[0]||null;if(pdfFile)pdfText.textContent=pdfFile.name};
async function render(){const a=await all();count.textContent="("+a.length+")";list.innerHTML=a.length?a.map((b,i)=>'<div class="row">'+(b.cover?'<img class="thumb" src="'+b.cover+'">':'<div class="thumb"></div>')+'<div class="info"><b>'+escapeHtml(b.title)+'</b><br><small>₹'+b.price+' · '+escapeHtml(b.category||"General / Other")+'</small></div><div><button onclick="editBook('+b.id+')">Edit</button><button onclick="deleteBook('+b.id+')">Delete</button></div></div>').join(""):'<p>No books added yet.</p>'}
function escapeHtml(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
async function editBook(id){const b=(await all()).find(x=>x.id===id);if(!b)return;editingId=id;title.value=b.title||"";author.value=b.author||"Rahul Kumar Das";price.value=b.price||0;category.value=b.category||"General / Other";desc.value=b.desc||"";samplePages.value=b.samplePages||"";amazon.value=b.amazon||"";buyLink.value=b.buyLink||"";coverFile=null;pdfFile=null;coverText.textContent=b.cover?"Current cover retained":"Choose cover image";pdfText.textContent=b.pdfName?"Current PDF: "+b.pdfName:"Choose PDF file";preview.src=b.cover||"";preview.style.display=b.cover?"block":"none";heading.textContent="Edit Book";save.textContent="Update Book";cancel.style.display="inline-block";scrollTo({top:0,behavior:"smooth"})}
async function deleteBook(id){if(!confirm("Delete this book?"))return;await removeBook(id);if(editingId===id)reset();await render()}
function reset(){bookForm.reset();author.value="Rahul Kumar Das";editingId=null;coverFile=null;pdfFile=null;preview.style.display="none";preview.src="";coverText.textContent="Choose cover image";pdfText.textContent="Choose PDF file";heading.textContent="Add New Book";save.textContent="Add Book";cancel.style.display="none"}
bookForm.onsubmit=async e=>{e.preventDefault();save.disabled=true;save.textContent="Saving...";try{const old=editingId?(await all()).find(x=>x.id===editingId):null;const b={title:title.value.trim(),author:author.value.trim()||"Rahul Kumar Das",price:Number(price.value),category:category.value,desc:desc.value.trim(),samplePages:samplePages.value.trim(),amazon:amazon.value.trim(),buyLink:buyLink.value.trim(),cover:coverFile?await readFile(coverFile):(old?.cover||""),pdf:pdfFile?await readFile(pdfFile):(old?.pdf||null),pdfName:pdfFile?pdfFile.name:(old?.pdfName||""),status:"Published"};await saveBook(b);reset();await render();alert("Book saved successfully.")}catch(err){console.error(err);alert("Could not save the book. Please try again.")}finally{save.disabled=false}};
cancel.onclick=reset;
async function photos(){const d=await db();return new Promise((res,rej)=>{const q=d.transaction(PHOTO_STORE,"readonly").objectStore(PHOTO_STORE).getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function savePhoto(p){const d=await db();return new Promise((res,rej)=>{const q=d.transaction(PHOTO_STORE,"readwrite").objectStore(PHOTO_STORE).add(p);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function removePhoto(id){const d=await db();return new Promise((res,rej)=>{const q=d.transaction(PHOTO_STORE,"readwrite").objectStore(PHOTO_STORE).delete(id);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function renderPhotos(){const a=await photos();photoList.innerHTML=a.length?a.map(p=>'<div class="row"><img class="thumb" src="'+p.image+'"><div class="info"><b>'+escapeHtml(p.title||"Untitled Photo")+'</b><br><small>'+escapeHtml(p.category||"Other")+'</small></div><button onclick="deletePhoto('+p.id+')">Delete</button></div>').join(""):'<p>No photos uploaded yet.</p>'}
photoForm.onsubmit=async e=>{e.preventDefault();const f=photoFile.files[0];if(!f)return;photoSave.disabled=true;photoSave.textContent="Uploading...";try{await savePhoto({title:photoTitle.value.trim(),category:photoCategory.value,image:await readFile(f),fileName:f.name,createdAt:Date.now()});photoForm.reset();await renderPhotos();alert("Photo uploaded successfully")}catch(err){console.error(err);alert("Could not upload the photo. Please try again.")}finally{photoSave.disabled=false;photoSave.textContent="Upload Photo"}};
async function deletePhoto(id){if(!confirm("Delete this photo?"))return;await removePhoto(id);await renderPhotos()}
render();renderPhotos();
</script></body></html>
