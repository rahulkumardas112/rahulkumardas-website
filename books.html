<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Books | Rahul Kumar Das</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><span>Rahul Kumar Das</span><small>Author · Academic · Educator · Researcher</small></a><nav style="display:flex"><a href="index.html">Home</a><a href="academic.html">Academic Store</a><a href="library.html">My Library</a></nav></div></header><main class="inner-page"><div class="container"><p class="eyebrow">BOOKS</p><h1 class="page-title">The complete bookshelf.</h1><p>Explore literary works, new releases and books on the human experience.</p><div class="toolbar"><input placeholder="Search books..." oninput="filterBooks(this.value)"><select><option>All Categories</option><option>Life</option><option>Relationships</option><option>Human Psychology</option></select></div><div class="product-grid" id="allBooks"></div></div></main><script src="app.js"></script><script>function filterBooks(q){document.querySelectorAll("#allBooks .product-card").forEach(x=>x.style.display=x.innerText.toLowerCase().includes(q.toLowerCase())?"":"none")}function render(){allBooks.innerHTML=getBooks().map((b,i)=>`<article class="product-card"><div class="cover">${b.title}</div><div class="product-body"><h3>${b.title}</h3><p>${b.desc}</p><span class="price">₹${b.price}</span><div class="card-actions"><a class="small-btn" href="book.html?i=${i}">View</a><a class="small-btn primary" href="checkout.html?i=${i}">Buy Ebook</a></div></div></article>`).join("")}render();</script></body></html>
