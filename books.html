<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Books | Rahul Kumar Das</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><span>Rahul Kumar Das</span><small>Author · Academic · Educator · Researcher</small></a><nav style="display:flex"><a href="index.html">Home</a><a href="academic.html">Academic Store</a><a href="library.html">My Library</a></nav></div></header>
<main class="inner-page"><div class="container"><p class="eyebrow">BOOKS</p><h1 class="page-title">The complete bookshelf.</h1><p>Explore literary works, new releases and books on the human experience.</p>
<div class="toolbar"><input placeholder="Search books..." oninput="filterBooks(this.value)"><select id="categoryFilter" onchange="render()">
<option>All Categories</option>
<option>General / Other</option>
<option>Literary Fiction</option><option>Romance</option><option>Contemporary Fiction</option><option>Poetry</option><option>Short Stories</option><option>Biography & Memoir</option>
<option>Self Help & Personal Development</option><option>Psychology</option><option>Philosophy</option><option>Human Behaviour</option><option>Relationships</option><option>Love, Loss & Heartbreak</option><option>Mindfulness & Consciousness</option><option>Spirituality</option><option>Motivation & Life Lessons</option><option>Society & Culture</option>
<option>Education</option><option>Academic Books</option><option>Accountancy</option><option>Accounting & Finance</option><option>Economics</option><option>Business & Management</option><option>Entrepreneurship & Startups</option><option>Commerce</option><option>Marketing</option><option>Banking & Financial Services</option><option>Stock Market & Investing</option><option>Taxation</option><option>Statistics & Data Analysis</option><option>Research Methodology</option>
<option>Competitive Exam Books</option><option>Question Banks</option><option>Notes & Study Materials</option><option>UGC NET / SET</option><option>School & College Textbooks</option><option>Reference Books</option><option>Research Reports</option>
<option>Assam Studies</option><option>North East India</option><option>History</option><option>Political Science</option><option>Sociology</option><option>Language & Literature</option><option>Health & Wellness</option><option>Children's Books</option><option>Digital Guides & Workbooks</option>
</select></div>
<div id="bookCount" style="margin:18px 0;font-size:13px;color:#6c665e"></div><div class="product-grid" id="allBooks"></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const BOOKS_SUPABASE_URL="https://ucehhsythixyvhrzwlth.supabase.co";
const BOOKS_SUPABASE_KEY="sb_publishable_bK03-qntjRlai8Q7yybHzw_JYn3FQrC";
const BOOKS_REST_URL="https://ucehhsythixyvhrzwlth.supabase.co/rest/v1/books?select=*&order=id.asc";
const BOOKS_REST_KEY="sb_publishable_bK03-qntjRlai8Q7yybHzw_JYn3FQrC";
let allCloudBooks=[];
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function filterBooks(q){q=(q||"").toLowerCase();document.querySelectorAll("#allBooks .product-card").forEach(x=>x.style.display=x.innerText.toLowerCase().includes(q)?"":"none");}
function render(){
 const selected=document.getElementById("categoryFilter").value;
 const list=allCloudBooks.filter(b=>selected==="All Categories"||b.category===selected);
 document.getElementById("bookCount").textContent=list.length+" books available";
 document.getElementById("allBooks").innerHTML=list.map(b=>{
   const id=encodeURIComponent(String(b.id)), title=esc(b.title||"Untitled");
   const desc=esc((b.description||"").length>150?b.description.slice(0,150).trim()+"…":(b.description||""));
   const cover=b.cover_url?'<img src="'+esc(b.cover_url)+'" alt="'+title+'" loading="lazy" style="width:100%;height:100%;object-fit:cover;border-radius:6px">':'<span>'+title+'</span>';
   const buy=b.buy_link||("checkout.html?id="+id);
   return '<article class="product-card"><div class="cover">'+cover+'</div><div class="product-body"><h3>'+title+'</h3><p class="book-excerpt">'+desc+'</p><span class="price">₹'+Number(b.price||0)+'</span><div class="card-actions"><a class="small-btn" href="book.html?id='+id+'">View Book</a><a class="small-btn" href="book.html?id='+id+'#description">Read More</a><a class="small-btn" href="book.html?id='+id+'#sample">Read</a><a class="small-btn primary" href="'+esc(buy)+'">Buy Ebook</a></div></div></article>';
 }).join("");
}
async function loadAllBooks(){
 const count=document.getElementById("bookCount"); count.textContent="Loading all books…";
 try{
   const response=await fetch(BOOKS_REST_URL,{headers:{"apikey":BOOKS_REST_KEY,"Authorization":"Bearer "+BOOKS_REST_KEY},cache:"no-store"});
   if(!response.ok) throw new Error("Books service returned HTTP "+response.status);
   const data=await response.json();
   allCloudBooks=Array.isArray(data)?data:[];
   render();
   count.textContent=allCloudBooks.length+" books available";
 }catch(error){
   console.error(error);
   count.textContent="Unable to load books. "+(error?.message||"Please refresh the page.");
 }
}

loadAllBooks();
</script></body></html>
