<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Polymathica: Journal of Multidisciplinary Research. A free, open-access, double-blind peer-reviewed quarterly journal from Assam, India.">
<link rel="canonical" href="https://rahulkumardas.in/polymathica/">
<title>Polymathica: Journal of Multidisciplinary Research</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#ffffff; --bg-soft:#f3f5f8; --fg:#1b2230; --muted:#5a6476; --line:#d9dee7;
  --brand:#0b3a6e; --brand-ink:#ffffff; --accent:#c4561a; --link:#0a58a8; --chip:#e7eef7;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161f; --bg-soft:#181f2b; --fg:#e4e8ef; --muted:#9aa5b8; --line:#2a3445;
  --brand:#16345a; --brand-ink:#f2f5fa; --accent:#e98a4f; --link:#7fb3ec; --chip:#1d2a3d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161f; --bg-soft:#181f2b; --fg:#e4e8ef; --muted:#9aa5b8; --line:#2a3445;
  --brand:#16345a; --brand-ink:#f2f5fa; --accent:#e98a4f; --link:#7fb3ec; --chip:#1d2a3d; color-scheme:dark}

body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.6}
*{box-sizing:border-box}img{max-width:100%}[hidden]{display:none!important}
a{color:var(--link)}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1140px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.util{background:var(--brand);color:var(--brand-ink);font-size:13px}
.util .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:8px}
.sel{user-select:all}
.util b{font-family:var(--serif);font-size:15px;letter-spacing:.02em}

.mast{border-bottom:1px solid var(--line)}
.mast .wrap{display:flex;gap:24px;align-items:center;padding-block:24px;flex-wrap:wrap}
.cover{width:104px;aspect-ratio:3/4;max-width:100%;flex:none;background:var(--brand);color:var(--brand-ink);
  display:flex;flex-direction:column;justify-content:space-between;padding:10px;box-shadow:0 2px 8px rgba(0,0,0,.18);position:relative;overflow:hidden}
.cover::after{content:"";position:absolute;left:0;right:0;bottom:30%;height:4px;background:var(--accent)}
.cover span{font-family:var(--serif);font-weight:700;font-size:15px;line-height:1.1}
.cover small{font-size:9px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.mast-text{min-width:0;flex:1}
.mast h1{font-family:var(--serif);font-size:clamp(28px,5vw,40px);line-height:1.1;margin:0;text-wrap:balance}
.mast .sub{font-family:var(--serif);font-size:18px;color:var(--muted);margin:4px 0 12px}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted)}
.meta strong{color:var(--fg);font-weight:600}

nav.tabs{border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{font:500 14px var(--sans);color:var(--fg);background:none;border:0;border-bottom:3px solid transparent;
  padding:12px 12px 9px;white-space:nowrap;cursor:pointer}
nav.tabs button:hover{color:var(--link)}
nav.tabs button[aria-selected="true"]{border-bottom-color:var(--accent);color:var(--link)}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:40px;padding-block:32px 56px}
@media (max-width:860px){.layout{grid-template-columns:1fr}}
main{min-width:0}
main h2{font-family:var(--serif);font-size:28px;line-height:1.2;margin:0 0 16px;text-wrap:balance}
main h3{font-family:var(--serif);font-size:20px;margin:28px 0 8px}
main p,main li{max-width:68ch}
.lede{font-size:17px;color:var(--fg)}
.note{background:var(--bg-soft);border-left:3px solid var(--accent);padding:12px 16px;margin:20px 0;font-size:14px}

.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;padding:0;list-style:none;margin:12px 0}
.subjects li{border:1px solid var(--line);padding:10px 12px;font-size:14px}
.subjects li b{display:block;font-weight:600;color:var(--brand)}
:root[data-theme="dark"] .subjects li b{color:var(--link)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .subjects li b{color:var(--link)}}

.steps{list-style:none;padding:0;margin:16px 0;counter-reset:s;display:grid;gap:14px}
.steps li{counter-increment:s;display:grid;grid-template-columns:36px 1fr;gap:12px}
.steps li::before{content:counter(s);width:32px;height:32px;border-radius:50%;background:var(--chip);color:var(--fg);
  display:grid;place-items:center;font-weight:600;font-variant-numeric:tabular-nums}
.steps b{display:block}

.tbl{overflow-x:auto;margin:12px 0}
