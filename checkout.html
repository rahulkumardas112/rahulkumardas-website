<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | Rahul Kumar Das</title><link rel="stylesheet" href="styles.css"></head><body><main class="inner-page"><div class="container" style="max-width:720px"><a class="text-link" href="books.html">← Back to Books</a><h1 class="page-title">Secure Checkout</h1><div class="admin-panel"><h2 id="product"></h2><p id="amount" class="price"></p><form onsubmit="pay(event)"><div class="form-grid"><label>Full Name<input required></label><label>Email<input type="email" required></label><label class="full">Payment method<select><option>Payment Gateway</option><option>UPI</option><option>Card</option></select></label><div class="full"><button class="btn dark">Proceed to Payment</button></div></div></form></div></div></main><script>let i=new URLSearchParams(location.search).get("i")||0;let a=JSON.parse(localStorage.getItem("rkd_books")||"null")||[{title:"The Human Need to Be Remembered",price:299}];let b=a[i]||a[0];product.textContent=b.title;amount.textContent="₹"+b.price;function pay(e){e.preventDefault();alert("Demo checkout: connect Razorpay/your chosen payment gateway here for live payments.");location.href="library.html"}</script></body></html>
