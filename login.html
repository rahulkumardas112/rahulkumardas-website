<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Access | Rahul Kumar Das</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="cloud-cms.js"></script></head><body><main class="inner-page"><div class="container" style="max-width:520px"><a class="text-link" href="index.html">Home</a><h1 class="page-title">Admin Access</h1><div class="admin-panel"><div id="message" style="padding:12px;margin-bottom:18px;border-radius:6px;display:none"></div><form id="authForm"><label>Email<input id="email" autocomplete="email" style="width:100%;padding:12px;margin:6px 0 15px" type="email" required></label><label>Password<input id="password" autocomplete="new-password" style="width:100%;padding:12px;margin:6px 0 20px" type="password" minlength="6" required></label><div class="actions"><button class="btn dark" type="submit" id="loginBtn">Log In</button><button class="btn light" type="button" id="createBtn">Create Admin Account</button><button class="btn light" type="button" id="resendBtn" style="display:none;margin-top:10px">Resend Confirmation Email</button></div></form><p id="help" style="margin-top:18px;color:#666">Use your email and a password of at least 6 characters. Your admin account is stored securely by Supabase.</p></div></div></main><script>
const msg=document.getElementById("message"),form=document.getElementById("authForm"),loginBtn=document.getElementById("loginBtn"),createBtn=document.getElementById("createBtn"),resendBtn=document.getElementById("resendBtn");
function show(text,ok){msg.textContent=text;msg.style.display="block";msg.style.background=ok?"#eaf7ee":"#fff0f0";msg.style.color=ok?"#176b2c":"#9b1c1c"}
function vals(){return {email:document.getElementById("email").value.trim(),password:document.getElementById("password").value}}
async function login(){const v=vals();if(!v.email||!v.password)return;loginBtn.disabled=true;loginBtn.textContent="Logging in...";try{const {data,error}=await rkdSupabase.auth.signInWithPassword(v);if(error)throw error;if(data.session){show("Login successful. Opening Admin...",true);setTimeout(()=>location.href="admin.html",500)}else show("Login was not completed. Please try again.",false)}catch(e){const m=e.message||"Login failed.";if(/email_not_confirmed|email.*not confirmed/i.test(m)){show("Your email is not confirmed. Click the confirmation link in your email, or use Resend Confirmation Email below.",false);resendBtn.style.display="inline-block"}else show(m,false)}finally{loginBtn.disabled=false;loginBtn.textContent="Log In"}}
form.addEventListener("submit",e=>{e.preventDefault();login()});
createBtn.addEventListener("click",async()=>{const v=vals();if(!v.email||!v.password){show("Enter your email and password first.",false);return}createBtn.disabled=true;createBtn.textContent="Creating...";try{const redirect=location.origin+location.pathname.replace("login.html","admin.html");const {data,error}=await rkdSupabase.auth.signUp({email:v.email,password:v.password,options:{emailRedirectTo:redirect}});if(error)throw error;if(data.session){show("Admin account created. Opening Admin...",true);resendBtn.style.display="none";setTimeout(()=>location.href="admin.html",500)}else if(data.user){show("Account created. Please check your email and click the confirmation link, then return here and log in. If you do not receive it, use Resend Confirmation Email.",true);resendBtn.style.display="inline-block"}else show("The account could not be created. Please try again.",false)}catch(e){let m=e.message||"Account creation failed.";if(/signup|signups|disabled/i.test(m))m="New account registration is disabled in the Supabase project. Enable email sign ups, then try again.";show(m,false)}finally{createBtn.disabled=false;createBtn.textContent="Create Admin Account"}});
(async()=>{const u=await rkdCloud.user();if(u){show("You are already logged in. Opening Admin...",true);setTimeout(()=>location.href="admin.html",300)}})();
</script></body></html>
