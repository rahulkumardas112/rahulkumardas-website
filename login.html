<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | Rahul Kumar Das</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="cloud-cms.js"></script></head><body><main class="inner-page"><div class="container" style="max-width:520px"><a class="text-link" href="index.html">Home</a><h1 class="page-title">Admin Login</h1><div class="admin-panel"><div id="message" style="margin-bottom:15px"></div><form id="loginForm"><label>Email<input id="email" style="width:100%;padding:12px;margin:6px 0 15px" type="email" required></label><label>Password<input id="password" style="width:100%;padding:12px;margin:6px 0 20px" type="password" minlength="6" required></label><div class="actions"><button class="btn dark" type="submit">Login</button><button class="btn light" type="button" id="signup">Create Admin Account</button></div></form><p style="margin-top:18px;color:#666">Create your account once, then use the same email and password whenever you open the Admin page.</p></div></div></main><script>
const msg=document.getElementById("message");function show(t,ok){msg.textContent=t;msg.style.color=ok?"#176b2c":"#9b1c1c"}
document.getElementById("loginForm").onsubmit=async e=>{e.preventDefault();try{const {error}=await rkdSupabase.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)throw error;show("Login successful. Opening Admin...",true);setTimeout(()=>location.href="admin.html",500)}catch(e){show(e.message||"Login failed.")}};
document.getElementById("signup").onclick=async()=>{try{const {error}=await rkdSupabase.auth.signUp({email:email.value.trim(),password:password.value});if(error)throw error;show("Account created. If email confirmation is enabled, confirm your email and then log in.",true)}catch(e){show(e.message||"Account creation failed.")}};
</script></body></html>
